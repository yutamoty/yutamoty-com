{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ .Content }}
{{ $pages := .Pages }}
{{ if $pages }}
<ul class="post-list">
  {{ range $pages }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
